name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore BifitReport.sln
      - run: dotnet build BifitReport.sln -c Release --no-restore
      - run: dotnet test BifitReport.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"
